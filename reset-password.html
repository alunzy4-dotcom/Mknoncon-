<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعادة تعيين كلمة المرور | مكنون كون</title>
<link rel="stylesheet" href="styles.css">
<style>
.wrap{min-height:100vh;display:grid;place-items:center;padding:30px}
.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);padding:36px}
.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input{width:100%;padding:12px;border:1px solid var(--line);background:#fbfaf7}
.card .btn{width:100%;text-align:center;margin-top:8px}
.back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px}
#status{padding:12px;margin:12px 0;border:1px solid var(--line);font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<main class="wrap">
<section class="card">
<span class="mark">MK</span>
<h1>إعادة تعيين كلمة المرور</h1>
<p id="status">اكتب كلمة مرور جديدة لحسابك.</p>
<form id="resetForm">
<div class="field">
<label>كلمة المرور الجديدة</label>
<input id="password" type="password" minlength="6" autocomplete="new-password" required>
</div>
<button class="btn" type="submit">حفظ كلمة المرور الجديدة</button>
</form>
<a class="back" href="auth.html">العودة إلى تسجيل الدخول</a>
</section>
</main>

<script>
const cfg = window.MKNON_SUPABASE || {};
const statusBox = document.getElementById('status');
const form = document.getElementById('resetForm');

function setStatus(message){ statusBox.textContent = message; }

if (!cfg.url || !cfg.anonKey) {
  setStatus('إعداد Supabase غير مكتمل.');
  form.querySelector('button').disabled = true;
} else {
  const client = supabase.createClient(cfg.url, cfg.anonKey);

  client.auth.getSession().then(({ data }) => {
    if (!data?.session) {
      setStatus('افتح هذه الصفحة من رابط استعادة كلمة المرور الذي وصلك على البريد الإلكتروني.');
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;

    const { error } = await client.auth.updateUser({ password });
    if (error) {
      setStatus(error.message);
      return;
    }

    setStatus('تم تغيير كلمة المرور بنجاح. سيتم تحويلك إلى تسجيل الدخول.');
    await client.auth.signOut();
    setTimeout(() => location.href = 'auth.html', 1200);
  });
}
</script>
</body>
</html>
