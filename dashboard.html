<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة العميل | مكنون كون</title>
<link rel="stylesheet" href="styles.css">
<style>
.wrap{width:min(1000px,92%);margin:40px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.panel{background:#fff;border:1px solid var(--line);padding:26px;margin-bottom:18px}.muted{color:var(--muted)}
.status-chip{display:inline-block;padding:6px 10px;border:1px solid var(--line);font-size:12px}.row{display:flex;gap:12px;flex-wrap:wrap}
#error{display:none;padding:12px;border:1px solid #a33;margin-bottom:18px}
.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);background:#fbfaf7}.field textarea{min-height:120px;resize:vertical}
.request-card{border-top:1px solid var(--line);padding:16px 0}.request-card:first-child{border-top:0}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><p class="eyebrow">لوحة العميل</p><h1>مرحباً بك في مكنون كون</h1></div><div><a id="loginBtn" class="btn" href="auth.html" style="display:none">تسجيل الدخول</a><button id="logout" class="btn secondary">تسجيل الخروج</button></div></div>
  <div id="error"></div>
  <section class="panel"><h2>بيانات الحساب</h2><p id="userInfo" class="muted">جارٍ التحميل...</p></section>
  <section class="panel">
    <h2>طلب جديد</h2>
    <p class="muted">اختر الخدمة واكتب تفاصيل طلبك، وسيظهر مباشرة في سجل طلباتك.</p>
    <form id="requestForm">
      <div class="field">
        <label>نوع الخدمة</label>
        <select id="serviceType" required>
          <option value="">اختر الخدمة</option>
          <option>استشارات أعمال</option>
          <option>دراسة جدوى</option>
          <option>تطوير موقع إلكتروني</option>
          <option>خدمات مالية</option>
          <option>خدمات إدارية</option>
          <option>أخرى</option>
        </select>
      </div>
      <div class="field">
        <label>تفاصيل الطلب</label>
        <textarea id="requestDetails" placeholder="اكتب طلبك بالتفصيل..." required></textarea>
      </div>
      <button class="btn" type="submit">إرسال الطلب</button>
      <div id="requestStatus" class="muted" style="margin-top:10px"></div>
    </form>
  </section>
  <section class="panel"><h2>طلباتي</h2><p class="muted">هنا يظهر سجل طلباتك وحالتها.</p><div id="requests"></div></section>
  <section class="panel"><h2>الإحالات</h2><p class="muted">سيظهر هنا كود الإحالة الخاص بك.</p><div id="referral"></div></section>
</main>
<script>
const token = localStorage.getItem('mknon_access_token');
const rawUser = localStorage.getItem('mknon_user');
let user = null;
try { user = rawUser ? JSON.parse(rawUser) : null; } catch (_) {}

const sessionMissing = !token || !user?.id;
if (sessionMissing) {
  localStorage.removeItem('mknon_access_token');
  localStorage.removeItem('mknon_refresh_token');
  localStorage.removeItem('mknon_user');
}

async function api(payload) {
  const res = await fetch('auth-api.php', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    cache:'no-store',
    body:JSON.stringify(payload)
  });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(data.msg || data.message || data.error || ('HTTP ' + res.status));
  return data;
}

function showError(message) {
  const box=document.getElementById('error');
  box.style.display='block';
  box.textContent=message;
}

function renderRequests(requests) {
  const box = document.getElementById('requests');
  if (!Array.isArray(requests) || !requests.length) {
    box.innerHTML = '<p class="muted">لا توجد طلبات حتى الآن.</p>';
    return;
  }
  box.innerHTML = requests.map(r => {
    const date = r.created_at ? new Date(r.created_at).toLocaleString('ar-SA') : '';
    return '<div class="request-card">'
      + '<div class="row" style="justify-content:space-between"><strong>'+(r.service_type||'طلب')+'</strong><span class="status-chip">'+(r.status||'جديد')+'</span></div>'
      + (r.details ? '<p>'+r.details+'</p>' : '')
      + (date ? '<div class="muted">'+date+'</div>' : '')
      + '</div>';
  }).join('');
}

if (sessionMissing) {
  document.getElementById('logout').style.display='none';
  document.getElementById('loginBtn').style.display='inline-block';
  document.getElementById('userInfo').innerHTML = 'انتهت جلسة الدخول. استخدم زر تسجيل الدخول بالأعلى.';
  document.getElementById('requestForm').closest('.panel').style.display='none';
  document.getElementById('requests').innerHTML='<p class="muted">سجّل الدخول لعرض طلباتك.</p>';
} else (async()=>{
  try {
    document.getElementById('userInfo').textContent = user.email || 'تم تسجيل الدخول';

    const profile = await api({
      action:'profile',
      access_token:token,
      user_id:user.id
    });

    if (Array.isArray(profile) && profile[0]) {
      const p=profile[0];
      document.getElementById('userInfo').textContent=[p.full_name,p.phone,user.email].filter(Boolean).join(' — ');
      document.getElementById('referral').innerHTML='<span class="status-chip">كود الإحالة: '+(p.referral_code||'غير متاح')+'</span>';
    }

    const requests = await api({
      action:'requests',
      access_token:token
    });

    renderRequests(requests);
  } catch (err) {
    showError('تعذر تحميل بيانات الحساب: ' + (err.message || err));
  }
})();

document.getElementById('requestForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=e.currentTarget.querySelector('button[type="submit"]');
  const status=document.getElementById('requestStatus');
  const service_type=document.getElementById('serviceType').value;
  const details=document.getElementById('requestDetails').value.trim();

  btn.disabled=true;
  btn.textContent='جارٍ الإرسال...';
  status.textContent='';

  try {
    await api({
      action:'create_request',
      access_token:token,
      user_id:user.id,
      service_type,
      details
    });

    status.textContent='تم إرسال طلبك بنجاح.';
    document.getElementById('requestDetails').value='';
    document.getElementById('serviceType').value='';

    const requests=await api({
      action:'requests',
      access_token:token
    });
    renderRequests(requests);
  } catch(err) {
    status.textContent='تعذر إرسال الطلب: '+(err.message||err);
  } finally {
    btn.disabled=false;
    btn.textContent='إرسال الطلب';
  }
});

document.getElementById('logout').onclick=()=>{
  localStorage.removeItem('mknon_access_token');
  localStorage.removeItem('mknon_refresh_token');
  localStorage.removeItem('mknon_user');
  location.href='auth.html';
};
</script>
</body></html>
