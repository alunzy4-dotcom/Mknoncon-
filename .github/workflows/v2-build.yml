name: Mknoncon V2 Build

on:
  push:
    branches: [mknoncon-v2]
    paths:
      - "v2/**"
      - ".github/workflows/v2-build.yml"
  pull_request:
    paths:
      - "v2/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test_publishable_key
      NEXT_PUBLIC_SITE_URL: https://beta.mknoncon.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package.json
      - run: npm install
      - run: npm run build
