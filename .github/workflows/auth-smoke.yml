name: Auth smoke test

on:
  push:
    paths:
      - ".github/workflows/auth-smoke.yml"

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deployed auth page
        run: |
          set -e
          curl -fsSL https://mknoncon.com/auth.html -o /tmp/auth.html
          grep -q "إنشاء الحساب" /tmp/auth.html
          grep -q "auth.js" /tmp/auth.html
          echo "SITE_OK"

      - name: Test Supabase signup and profile creation
        run: |
          set -euo pipefail

          SUPABASE_URL=$(python3 - <<'PY'
          import re
          s=open('supabase-config.js').read()
          print(re.search(r'url:\s*"([^"]+)"', s).group(1))
          PY
          )

          SUPABASE_KEY=$(python3 - <<'PY'
          import re
          s=open('supabase-config.js').read()
          print(re.search(r'anonKey:\s*"([^"]+)"', s).group(1))
          PY
          )

          EMAIL="smoke-${GITHUB_RUN_ID}@example.com"
          PASSWORD="MknonconTest-2026!"

          HTTP=$(curl -sS -o /tmp/signup.json -w "%{http_code}"             -X POST "$SUPABASE_URL/auth/v1/signup"             -H "apikey: $SUPABASE_KEY"             -H "Authorization: Bearer $SUPABASE_KEY"             -H "Content-Type: application/json"             --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"data\":{\"full_name\":\"Smoke Test\",\"phone\":\"0500000000\"}}")

          echo "SIGNUP_HTTP=$HTTP"

          python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/signup.json'))
          print("SIGNUP_RESPONSE_KEYS", sorted(d.keys()))
          if d.get('error') or d.get('error_code') or d.get('msg'):
              print("SIGNUP_ERROR", d)
              sys.exit(2)
          user=d.get('user') or {}
          session=d.get('session')
          token=d.get('access_token') or (session or {}).get('access_token')
          uid=user.get('id')
          print("USER_ID", uid)
          print("HAS_SESSION", bool(token))
          if not uid:
              sys.exit(3)
          open('/tmp/uid','w').write(uid)
          if token:
              open('/tmp/token','w').write(token)
          PY

          if [ ! -s /tmp/token ]; then
            echo "NO_SESSION_AFTER_SIGNUP"
            exit 4
          fi

          UID=$(cat /tmp/uid)
          TOKEN=$(cat /tmp/token)

          PHTTP=$(curl -sS -o /tmp/profile.json -w "%{http_code}"             "$SUPABASE_URL/rest/v1/profiles?id=eq.$UID&select=id,full_name,phone,referral_code"             -H "apikey: $SUPABASE_KEY"             -H "Authorization: Bearer $TOKEN")

          echo "PROFILE_HTTP=$PHTTP"

          python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/profile.json'))
          if not isinstance(d,list) or not d:
              print("PROFILE_NOT_CREATED", d)
              sys.exit(5)
          print("PROFILE_OK", d[0])
          PY
