name: Browser auth diagnostic

on:
  push:
    paths:
      - ".github/workflows/auth-smoke.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed files are current
        run: |
          set -euo pipefail
          curl -fsSL https://mknoncon.com/auth.js -o /tmp/live-auth.js
          curl -fsSL https://mknoncon.com/supabase-config.js -o /tmp/live-config.js
          echo "LIVE_AUTH_SHA=$(sha256sum /tmp/live-auth.js | cut -d' ' -f1)"
          echo "REPO_AUTH_SHA=$(sha256sum auth.js | cut -d' ' -f1)"
          diff -u auth.js /tmp/live-auth.js
          diff -u supabase-config.js /tmp/live-config.js
          echo "DEPLOYMENT_CURRENT"

      - name: Check browser CORS preflight to Supabase
        run: |
          set -euo pipefail
          SUPABASE_URL=$(python3 - <<'PY'
          import re
          s=open('supabase-config.js').read()
          print(re.search(r'url:\s*"([^"]+)"', s).group(1))
          PY
          )
          SUPABASE_KEY=$(python3 - <<'PY'
          import re
          s=open('supabase-config.js').read()
          print(re.search(r'anonKey:\s*"([^"]+)"', s).group(1))
          PY
          )

          curl -sS -D /tmp/headers -o /dev/null             -X OPTIONS "$SUPABASE_URL/auth/v1/signup"             -H "Origin: https://mknoncon.com"             -H "Access-Control-Request-Method: POST"             -H "Access-Control-Request-Headers: apikey,authorization,content-type,x-client-info"

          cat /tmp/headers
          grep -i "access-control-allow-origin" /tmp/headers
          grep -i "access-control-allow-headers" /tmp/headers
          echo "CORS_OK"

      - name: Signup with browser Origin header
        run: |
          set -euo pipefail
          SUPABASE_URL=$(python3 - <<'PY'
          import re
          s=open('supabase-config.js').read()
          print(re.search(r'url:\s*"([^"]+)"', s).group(1))
          PY
          )
          SUPABASE_KEY=$(python3 - <<'PY'
          import re
          s=open('supabase-config.js').read()
          print(re.search(r'anonKey:\s*"([^"]+)"', s).group(1))
          PY
          )

          EMAIL="browser-${GITHUB_RUN_ID}@example.com"
          PASSWORD="MknonconTest-2026!"

          HTTP=$(curl -sS -D /tmp/signup-headers -o /tmp/signup.json -w "%{http_code}"             -X POST "$SUPABASE_URL/auth/v1/signup"             -H "Origin: https://mknoncon.com"             -H "apikey: $SUPABASE_KEY"             -H "Authorization: Bearer $SUPABASE_KEY"             -H "Content-Type: application/json"             --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"data\":{\"full_name\":\"Browser Test\",\"phone\":\"0500000000\"}}")

          echo "HTTP=$HTTP"
          cat /tmp/signup-headers
          python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/signup.json'))
          print("keys", sorted(d.keys()))
          print("has_user", bool(d.get("user")))
          print("has_access_token", bool(d.get("access_token")))
          if "error_code" in d or int(__import__("os").environ.get("HTTP_STATUS","200")) >= 400:
              print(d)
          PY
          test "$HTTP" = "200"
          grep -i "access-control-allow-origin" /tmp/signup-headers
          echo "BROWSER_ORIGIN_SIGNUP_OK"
